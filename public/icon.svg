<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a0820"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="55%">
      <stop offset="55%" stop-color="#ff4fb8" stop-opacity="0"/>
      <stop offset="80%" stop-color="#ff4fb8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff4fb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffd1ec"/>
      <stop offset="50%" stop-color="#ff4fb8"/>
      <stop offset="100%" stop-color="#a8267a"/>
    </linearGradient>
    <linearGradient id="vfill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffd1ec"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <!-- Soft halo glow -->
  <circle cx="90" cy="90" r="80" fill="url(#halo)"/>
  <!-- Outer thin ring -->
  <circle cx="90" cy="90" r="68" fill="none" stroke="#ff4fb8" stroke-width="0.8" opacity="0.35"/>
  <!-- Main magenta ring -->
  <circle cx="90" cy="90" r="60" fill="none" stroke="url(#ring)" stroke-width="5"/>
  <!-- "V" mark center, big and clean -->
  <path d="M 60 62 L 90 122 L 120 62" stroke="url(#vfill)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Tiny dot top of V (tanit moon) -->
  <circle cx="90" cy="55" r="3" fill="#ffffff" opacity="0.9"/>
</svg>
